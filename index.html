<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-2kuAsvqJb4CnrTDrX16D7iUUq5YVodGMei7d86ajJnA='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Caudal · Back to the app</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f6f8; --card:#fff; --text:#14171f; --muted:#5e6573; --primary:#1e3a5f; --fg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#151a21; --text:#e7eaf0; --muted:#8b93a1; --primary:#5b8def; --fg:#0e1116; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:30rem; margin:1rem; padding:2rem; background:var(--card); border-radius:12px; }
  h1 { font-size:1.4rem; margin:0 0 .5rem; }
  p { color:var(--muted); }
  a.button { display:inline-block; padding:.6rem 1rem; border-radius:8px; background:var(--primary); color:var(--fg); text-decoration:none; font-weight:600; }
  code { display:block; margin-top:.5rem; padding:.6rem; border-radius:8px; background:var(--bg); word-break:break-all; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Returning to Caudal…</h1>
  <p id="body">Your bank sent you back. Caudal should open by itself.</p>
  <p><a class="button" id="open" href="#">Open Caudal</a></p>
  <p id="manual">If Caudal doesn't open, copy this address and paste it in Caudal's “Connect bank” window:<code id="url"></code></p>
</main>
<script>
// Forwards only the OAuth result (code/state or error) to the desktop app. Nothing is stored or sent anywhere else.
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  var safe = /^[A-Za-z0-9._~\-]{1,2048}$/;
  ["code", "state", "error"].forEach(function (k) { var v = q.get(k); if (v && safe.test(v)) out.set(k, v); });
  var desc = q.get("error_description"); if (desc) out.set("error_description", desc.slice(0, 300));
  var target = "caudal://bank-callback?" + out.toString();
  document.getElementById("open").href = target;
  document.getElementById("url").textContent = location.href;
  if (!out.has("state")) {
    document.getElementById("title").textContent = "Nothing to forward";
    document.getElementById("body").textContent = "This page only works as the end of a bank connection started in Caudal.";
    document.getElementById("open").style.display = "none";
    return;
  }
  location.href = target;
})();
</script>
</body>
</html>
